# Use case 1: OCI labels in a Dockerfile become searchable properties in Artifactory.
name: 01 OCI labels as properties
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  labels:
    runs-on: ubuntu-latest
    env:
      JF_URL: ${{ vars.JF_URL }}
      REGISTRY_HOST: ${{ vars.JF_DOCKER_REGISTRY }}
      REPO_LOCAL: oci-metadata-docker-local
      REPO_VIRTUAL: oci-metadata-docker
      TAG: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Setup JFrog CLI (OIDC)
        id: jf
        uses: jfrog/setup-jfrog-cli@v4
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Compute build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build and push base image (labels set in Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: examples/01-labels
          file: examples/01-labels/Dockerfile.base
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ env.REPO_VIRTUAL }}/labels-base:${{ env.TAG }}
          build-args: |
            REGISTRY=${{ env.REGISTRY_HOST }}/${{ env.REPO_VIRTUAL }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            BUILD_DATE=${{ env.BUILD_DATE }}

      - name: Build and push app image (FROM the base)
        uses: docker/build-push-action@v6
        with:
          context: examples/01-labels
          file: examples/01-labels/Dockerfile.app
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ env.REPO_VIRTUAL }}/labels-app:${{ env.TAG }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY_HOST }}/${{ env.REPO_VIRTUAL }}/labels-base:${{ env.TAG }}
            CI_RUN_ID=${{ github.run_id }}

      - name: Show labels-as-properties
        run: |
          {
            echo "## Use case 1: OCI labels as Artifactory properties"
            echo
            echo "Properties Artifactory wrote on each image's \`manifest.json\`:"
            echo
            bash scripts/show-labels.sh labels-base "$TAG"
            bash scripts/show-labels.sh labels-app "$TAG"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Search by property (REST, AQL, CLI) and assert
        run: |
          set -euo pipefail
          source scripts/lib.sh
          prop() { rt -s "/api/storage/${REPO_LOCAL}/$1/${TAG}/manifest.json?properties" | jq -r --arg k "docker.label.$2" '.properties[$k][0] // "MISSING"'; }

          # Override: the app redeclared role; the base kept its own value.
          [[ "$(prop labels-base com.example.image.role)" == base ]] || { echo "::error::base role != base"; exit 1; }
          [[ "$(prop labels-app  com.example.image.role)" == app  ]] || { echo "::error::app role != app (override failed)"; exit 1; }
          # Inheritance: the app never declared golden, the base did.
          [[ "$(prop labels-app  com.example.image.golden)" == true ]] || { echo "::error::golden label not inherited"; exit 1; }

          # 1) REST property search
          REST=$(rt -s "/api/search/prop?docker.label.com.example.team=payments&repos=${REPO_LOCAL}" | jq -r '.results[].uri')
          # 2) AQL (the saved query matches every run, so narrow to this tag)
          AQL=$(rt -s -XPOST /api/search/aql -H 'Content-Type: text/plain' -d @queries/labels.aql | jq -r '.results[] | "\(.repo)/\(.path)/\(.name)"')
          # 3) CLI
          CLI=$(jf rt search --props "docker.label.com.example.team=payments" "${REPO_LOCAL}/*/manifest.json" | jq -r '.[].path')

          echo "$REST" | grep -q "labels-app/${TAG}/manifest.json"  || { echo "::error::REST search missed labels-app"; exit 1; }
          echo "$AQL"  | grep -q "labels-base/${TAG}/manifest.json" || { echo "::error::AQL missed labels-base"; exit 1; }
          echo "$AQL"  | grep -q "labels-app/${TAG}/manifest.json"  || { echo "::error::AQL missed labels-app (inheritance)"; exit 1; }
          echo "$CLI"  | grep -q "labels-app/${TAG}/manifest.json"  || { echo "::error::CLI search missed labels-app"; exit 1; }

          {
            echo "### Searches (all assertions passed)"
            echo
            echo "**REST** \`GET /api/search/prop?docker.label.com.example.team=payments\`"
            echo '```'; echo "$REST"; echo '```'
            echo "**AQL** (\`queries/labels.aql\`: images carrying the inherited golden label)"
            echo '```'; echo "$AQL"; echo '```'
            echo "**CLI** \`jf rt search --props docker.label.com.example.team=payments\`"
            echo '```'; echo "$CLI"; echo '```'
            echo "Takeaways: the app override of \`role\` won, the base's \`golden\` label was inherited, and Artifactory copies labels to properties per image (it does not walk parents)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
