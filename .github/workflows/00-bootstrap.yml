name: 00 Bootstrap JFrog resources
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      JF_URL: ${{ vars.JF_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: jfrog/setup-jfrog-cli@v4
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}
      - run: bash scripts/bootstrap.sh
