name: 99 Teardown JFrog resources
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove the oci-metadata repos, build and bid-* Xray watches/policies'
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  teardown:
    if: ${{ inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    env:
      JF_URL: ${{ vars.JF_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: jfrog/setup-jfrog-cli@v4
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}
      - run: bash scripts/teardown.sh
