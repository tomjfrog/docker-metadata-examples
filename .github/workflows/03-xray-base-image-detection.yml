# Use case 3: Xray Base Image Detection. Base and app images both live in Artifactory;
# policies with/without "skip base image" show which findings the base image owns.
name: 03 Xray base image detection
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  base-image-detection:
    runs-on: ubuntu-latest
    env:
      JF_URL: ${{ vars.JF_URL }}
      REGISTRY_HOST: ${{ vars.JF_DOCKER_REGISTRY }}
      REPO_LOCAL: oci-metadata-docker-local
      REPO_VIRTUAL: oci-metadata-docker
      TAG: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Setup JFrog CLI (OIDC)
        id: jf
        uses: jfrog/setup-jfrog-cli@v4
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Ensure Xray policies and watches (A without skip, B with skip_base_image)
        run: bash scripts/xray-policies.sh

      # Order matters: Xray can only recognise the base if it is indexed BEFORE the app image.
      - name: Build and push BASE image
        uses: docker/build-push-action@v6
        with:
          context: examples/03-base-image
          file: examples/03-base-image/Dockerfile.base
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ env.REPO_VIRTUAL }}/bid-base:${{ env.TAG }}
          build-args: REGISTRY=${{ env.REGISTRY_HOST }}/${{ env.REPO_VIRTUAL }}

      - name: Wait for Xray to scan the base
        run: |
          mkdir -p out
          bash scripts/wait-for-xray-scan.sh bid-base "$TAG" out/summary-base.json

      - name: Build and push APP image (FROM the Artifactory-hosted base)
        uses: docker/build-push-action@v6
        with:
          context: examples/03-base-image
          file: examples/03-base-image/Dockerfile.app
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ env.REPO_VIRTUAL }}/bid-app:${{ env.TAG }}
          build-args: BASE_IMAGE=${{ env.REGISTRY_HOST }}/${{ env.REPO_VIRTUAL }}/bid-base:${{ env.TAG }}

      - name: Wait for Xray to scan the app
        run: bash scripts/wait-for-xray-scan.sh bid-app "$TAG" out/summary-app.json

      - name: Attribute findings and compare policies
        run: |
          set -euo pipefail
          source scripts/lib.sh
          sleep 20   # let violations be generated for both watches
          A=$(bash scripts/violation-counts.sh bid-watch-all bid-app)
          B=$(bash scripts/violation-counts.sh bid-watch-app-only bid-app)
          {
            echo "## Use case 3: Xray base image detection"
            echo
            echo "Base: \`bid-base:${TAG}\`  App: \`bid-app:${TAG}\` (FROM the base, both in \`${REPO_LOCAL}\`)"
            echo
            echo "### Policy comparison on \`bid-app\`"
            echo
            echo "| Watch | Policy | Violations |"
            echo "|---|---|---|"
            echo "| bid-watch-all | bid-all-vulns (no skip) | **${A}** |"
            echo "| bid-watch-app-only | bid-app-only (\`skip_base_image: true\`) | **${B}** |"
            echo
            echo "Violations dropped by *Skip base image*: **$((A-B))**. Those are findings owned by the base image."
            echo
            echo "### Layer-digest attribution (technique, not a product field)"
            echo
            bash scripts/classify-by-layer.sh out/summary-base.json out/summary-app.json
            echo
            echo "### See it in the UI"
            echo "Xray > Scans List > \`${REPO_LOCAL}/bid-app/${TAG}\` > Security tab > turn on **Exclude Base Image**; the SBOM tab has the same toggle."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$A" -gt 0 ]]  || { echo "::error::No violations on bid-app under the baseline policy"; exit 1; }
          [[ "$B" -lt "$A" ]] || { echo "::error::skip_base_image did not reduce violations (A=$A B=$B)"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xray-summaries-${{ github.run_number }}
          path: out/
